name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Не заданы секреты SIGNING_KEYSTORE_BASE64 и SIGNING_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-guard-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="ShortsGuard-v$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release edit "v$VER" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$VER" --title "Shorts Guard v$VER" --notes-file RELEASE_NOTES.md --latest
          fi
          gh release upload "v$VER" "$NAME" --clobber
