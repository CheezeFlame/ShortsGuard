name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-guard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="ShortsGuard-v$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --title "Shorts Guard v$VER" --notes "Сборка v$VER" --latest
          gh release upload "v$VER" "$NAME" --clobber
